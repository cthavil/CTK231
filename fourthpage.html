<div id="videoModal" class="videomodal">
  <div class="videomodalbox">
    <span class="closevideo" onclick="closeVideo()">&times;</span>
    <iframe id="popupVideo" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<script>
function openVideo(videoID) {
  const video = document.getElementById("popupVideo");
  video.src = "https://www.youtube.com/embed/" + videoID + "?autoplay=1&rel=0";
  document.getElementById("videoModal").style.display = "block";
}

function closeVideo() {
  const video = document.getElementById("popupVideo");
  video.src = "";
  document.getElementById("videoModal").style.display = "none";
}

window.onclick = function(event) {
  if (event.target.id === "videoModal") {
    closeVideo();
  }
}
</script>
